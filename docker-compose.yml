version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: pathwise-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pathwise
      POSTGRES_USER: pathwise
      POSTGRES_PASSWORD: pathwise
    ports:
      - "5432:5432"
    volumes:
      - pathwise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathwise -d pathwise"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pathwise_pgdata:
